<div class="flex flex-wrap items-center gap-x-3 gap-y-2">
  <div class="flex items-center gap-2">
    <span class="text-sm text-gray-600">From</span>
    <input type="date" class="border border-gray-300 rounded px-2 py-1 text-sm"
           [(ngModel)]="rangeStart" (change)="onRangeChange()" />
  </div>
  <div class="flex items-center gap-2">
    <span class="text-sm text-gray-600">To</span>
    <input type="date" class="border border-gray-300 rounded px-2 py-1 text-sm"
           [(ngModel)]="rangeEnd" (change)="onRangeChange()" />
  </div>
  <div class="flex items-center gap-1">
    <button class="px-2 py-1 text-xs rounded border hover:bg-gray-100"
            [class.bg-blue-100]="isRangeActive(null)" [class.border-blue-400]="isRangeActive(null)" [class.border-gray-300]="!isRangeActive(null)"
            (click)="setRange(null)">All</button>
    <button class="px-2 py-1 text-xs rounded border hover:bg-gray-100"
            [class.bg-blue-100]="isRangeActive(10)" [class.border-blue-400]="isRangeActive(10)" [class.border-gray-300]="!isRangeActive(10)"
            (click)="setRange(10)">Last 10y</button>
    <button class="px-2 py-1 text-xs rounded border hover:bg-gray-100"
            [class.bg-blue-100]="isRangeActive(5)" [class.border-blue-400]="isRangeActive(5)" [class.border-gray-300]="!isRangeActive(5)"
            (click)="setRange(5)">Last 5y</button>
    <button class="px-2 py-1 text-xs rounded border hover:bg-gray-100"
            [class.bg-blue-100]="isRangeActive(3)" [class.border-blue-400]="isRangeActive(3)" [class.border-gray-300]="!isRangeActive(3)"
            (click)="setRange(3)">Last 3y</button>
    <button class="px-2 py-1 text-xs rounded border hover:bg-gray-100"
            [class.bg-blue-100]="isRangeActive(1)" [class.border-blue-400]="isRangeActive(1)" [class.border-gray-300]="!isRangeActive(1)"
            (click)="setRange(1)">Last year</button>
    <button class="px-2 py-1 text-xs rounded border hover:bg-gray-100"
            [class.bg-blue-100]="isMonthRangeActive(6)" [class.border-blue-400]="isMonthRangeActive(6)" [class.border-gray-300]="!isMonthRangeActive(6)"
            (click)="setRangeMonths(6)">Last 6m</button>
    <button class="px-2 py-1 text-xs rounded border hover:bg-gray-100"
            [class.bg-blue-100]="isMonthRangeActive(3)" [class.border-blue-400]="isMonthRangeActive(3)" [class.border-gray-300]="!isMonthRangeActive(3)"
            (click)="setRangeMonths(3)">Last 3m</button>
    <button class="px-2 py-1 text-xs rounded border hover:bg-gray-100"
            [class.bg-blue-100]="isYtdActive()" [class.border-blue-400]="isYtdActive()" [class.border-gray-300]="!isYtdActive()"
            (click)="setRangeYtd()">YTD</button>
  </div>
</div>
