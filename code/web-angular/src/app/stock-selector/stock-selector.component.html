@if (availableStocks.length > 0) {
  <div class="mt-2 flex items-center gap-2 flex-wrap">
    <label class="text-sm text-gray-600 font-medium">Stocks</label>

    @for (symbol of selectedSymbols; track symbol) {
      <span class="inline-flex items-center gap-1 px-2 py-1 text-sm bg-indigo-100 text-indigo-800 rounded-full">
        {{ symbol }}
        <button (click)="removeStock(symbol)" class="text-indigo-400 hover:text-indigo-800 leading-none">&times;</button>
      </span>
    }

    @if (unselectedStocks.length > 0) {
      <select class="border border-gray-300 rounded px-2 py-1 text-sm"
              [(ngModel)]="pendingSymbol" (ngModelChange)="addStock($event)">
        <option value="">Add stock...</option>
        @for (stock of unselectedStocks; track stock.symbol) {
          <option [value]="stock.symbol">{{ stock.symbol }} — {{ stock.description }}</option>
        }
      </select>
    }
  </div>
}
