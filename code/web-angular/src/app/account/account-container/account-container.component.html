<app-account-selector [accounts]="accounts" (accountChanged)="accountSelected($event)"></app-account-selector>

@if (availableStocks.length > 0) {
  <div class="mt-2 flex items-center gap-2">
    <label class="text-sm text-gray-600 font-medium">Benchmark</label>
    <select class="border border-gray-300 rounded px-2 py-1 text-sm"
            [(ngModel)]="benchmarkSymbol" (ngModelChange)="onBenchmarkChange()">
      <option value="">None</option>
      @for (stock of availableStocks; track stock.symbol) {
        <option [value]="stock.symbol">{{ stock.symbol }} — {{ stock.description }}</option>
      }
    </select>
  </div>
}

<h4>Accounts: {{ portfolio?.accountCodes?.join(', ') }}</h4>

<div class="mb-4 flex flex-wrap items-center gap-x-6 gap-y-2">
  <label class="inline-flex items-center">
    <input type="checkbox" class="form-checkbox" [checked]="(showQualityData$ | async)" (change)="toggleShowQualityData()" />
    <span class="ml-2">Show quality data</span>
  </label>

  <div class="flex flex-wrap items-center gap-x-3 gap-y-2">
    <div class="flex items-center gap-2">
      <span class="text-sm text-gray-600">From</span>
      <input type="date" class="border border-gray-300 rounded px-2 py-1 text-sm"
             [(ngModel)]="rangeStart" (change)="onRangeChange()" />
    </div>
    <div class="flex items-center gap-2">
      <span class="text-sm text-gray-600">To</span>
      <input type="date" class="border border-gray-300 rounded px-2 py-1 text-sm"
             [(ngModel)]="rangeEnd" (change)="onRangeChange()" />
    </div>
    <div class="flex items-center gap-1">
      <button class="px-2 py-1 text-xs rounded border border-gray-300 hover:bg-gray-100" (click)="setRange(null)">All</button>
      <button class="px-2 py-1 text-xs rounded border border-gray-300 hover:bg-gray-100" (click)="setRange(10)">Last 10y</button>
      <button class="px-2 py-1 text-xs rounded border border-gray-300 hover:bg-gray-100" (click)="setRange(5)">Last 5y</button>
      <button class="px-2 py-1 text-xs rounded border border-gray-300 hover:bg-gray-100" (click)="setRange(3)">Last 3y</button>
      <button class="px-2 py-1 text-xs rounded border border-gray-300 hover:bg-gray-100" (click)="setRange(1)">Last year</button>
      <button class="px-2 py-1 text-xs rounded border border-gray-300 hover:bg-gray-100" (click)="setRangeMonths(6)">Last 6m</button>
      <button class="px-2 py-1 text-xs rounded border border-gray-300 hover:bg-gray-100" (click)="setRangeMonths(3)">Last 3m</button>
      <button class="px-2 py-1 text-xs rounded border border-gray-300 hover:bg-gray-100" (click)="setRangeYtd()">YTD</button>
    </div>
  </div>
</div>

<div class="grid grid-cols-3 gap-4 pt-0">

  <div class="col-span-2 flex flex-col">
    <app-history-chart class="h-full" [history]="filteredHistory" [benchmarkHistory]="benchmarkHistory" (rangeSelected)="onChartRangeSelected($event)"></app-history-chart>
  </div>

  <div class="flex flex-col gap-4">
    <app-summary [portfolio]="portfolio"></app-summary>
    <app-trailing-returns [trailingReturns]="filteredHistory?.trailingReturns ?? null" [benchmarkTrailingReturns]="benchmarkHistory?.trailingReturns ?? null"></app-trailing-returns>
  </div>

</div>
<div class="pt-6">
  <app-holdings [portfolio]="portfolio" [date]="date"> </app-holdings>
</div>

<div class="pt-6">
  <app-history [history]="filteredHistory" [date]="date"> </app-history>
</div>
